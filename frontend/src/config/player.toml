[navigation]
prev_restart_threshold = 3.0
prev_include_priority_queue = false

[volume]
default_volume = 1
volume_persistence = "localStorage"
fade_on_pause = true
pause_fade_ms = 350

[buffering]
prefetch_enabled = true
prefetch_delay_ms = 1500

[playback]
emit_interval_seconds = 15
account_sync_enabled = true
account_sync_interval_seconds = 2
account_sync_drift_seconds = 3

[history]
max_history_size = 100
history_persistence = "localStorage"
