services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/scripts:/app/scripts
      - ./frontend/src/config:/app/src/config
      - ${OMNIPLAYR_LOCAL_PLUGINS:-./frontend/src/plugins}:/external-plugins
      - ${OMNIPLAYR_LOCAL_FRONTEND_PLUGINS:-./frontend/src/plugins}:/external-frontend-plugins
      - ./backend/certs:/app/certs
    container_name: omniplayr_frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8223:8223"
      - "8323:8223"
      - "8523:8223"
    depends_on:
      - backend
      - frontend-init
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true

  frontend-init:
    image: alpine
    command: sh -c "mkdir -p /files/src/plugins /files/src/local-plugins /files/src/local-frontend-plugins"
    volumes:
      - ./frontend:/files

  backend-init:
      image: alpine
      command: sh -c "[ -d /files/config.local.json ] && rm -rf /files/config.local.json; touch /files/config.local.json"
      volumes:
        - ./backend:/files

  backend:
    build: ./backend
    container_name: omniplayr_backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./db:/db
      - ./backend/config:/app/config
      - ./backend/config.local.json:/app/config.local.json
      - ./backend/certs:/app/certs
      - ./user_storage:/user_storage
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./frontend/src:/frontend/src
      - ./backend/plugins:/app/plugins
      - ${OMNIPLAYR_LOCAL_PLUGINS:-./backend/plugins}:/external-plugins
      - ${OMNIPLAYR_LOCAL_BACKEND_PLUGINS:-./backend/plugins}:/external-backend-plugins
      - ./:/compose
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DEV_MODE=true
      - HOST_COMPOSE_DIR=${PWD}
    ports:
      - "8224:8224"
      - "8324:8224"
      - "8524:8224"
    depends_on:
      db:
        condition: service_started
      backend-init:
        condition: service_completed_successfully
    restart: on-failure:5

  db:
    image: postgres:16
    container_name: omniplayr_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: omniplayr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
