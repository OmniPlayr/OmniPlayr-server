name: Publish Release Manifest

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'backend/config.json'
      - 'frontend/src/config/version.toml'
      - 'docker-compose.yml'
      - '.github/scripts/generate-release-manifest.js'
      - '.github/workflows/publish-release-manifest.yml'
  workflow_run:
    workflows:
      - Update Backend Version
      - Update Frontend Version
      - Update Root Docker Compose
      - Sync Backend SDK
    types:
      - completed
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main

concurrency:
  group: release-manifest-${{ github.event.workflow_run.head_branch || inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Select branch
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "name=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OMNIPLAYR_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMNIPLAYR_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read

      - name: Wait for triggered workflows to settle
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            cutoff="${{ github.event.workflow_run.created_at }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            cutoff="${{ github.event.head_commit.timestamp }}"
          else
            cutoff="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

          if [ "${{ steps.branch.outputs.name }}" = "main" ]; then
            relevant_filter='(.name == "Update Backend Version" or .name == "Update Frontend Version" or .name == "Update Root Docker Compose" or .name == "Sync Backend SDK")'
          else
            relevant_filter='(.name == "Update Backend Version" or .name == "Update Frontend Version" or .name == "Update Root Docker Compose")'
          fi

          echo "Waiting briefly for sibling workflows to queue"
          sleep 60

          for attempt in $(seq 1 60); do
            active_runs="$(
              {
                gh api "repos/${{ github.repository }}/actions/runs" -f branch="${{ steps.branch.outputs.name }}" -f status=queued --paginate --jq ".workflow_runs[] | select($relevant_filter) | \"\(.name) #\(.run_number)\""
                gh api "repos/${{ github.repository }}/actions/runs" -f branch="${{ steps.branch.outputs.name }}" -f status=in_progress --paginate --jq ".workflow_runs[] | select($relevant_filter) | \"\(.name) #\(.run_number)\""
              } | sort -u
            )"

            if [ -n "$active_runs" ]; then
              echo "Waiting for triggered relevant workflows to finish:"
              echo "$active_runs"
              sleep 30
              continue
            fi

            failed_runs="$(
              gh api "repos/${{ github.repository }}/actions/runs" \
                -f branch="${{ steps.branch.outputs.name }}" \
                -f status=completed \
                --paginate \
                --jq ".workflow_runs[] | select($relevant_filter and .created_at >= \"$cutoff\" and .conclusion != \"success\") | \"\(.name) #\(.run_number) concluded \(.conclusion)\""
            )"

            if [ -n "$failed_runs" ]; then
              echo "A triggered relevant workflow did not succeed:"
              echo "$failed_runs"
              exit 1
            fi

            echo "No triggered relevant workflows are still running on ${{ steps.branch.outputs.name }}"
            exit 0
          done

          echo "Timed out waiting for triggered workflows on ${{ steps.branch.outputs.name }}" >&2
          exit 1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate manifest
        run: GITHUB_SHA="$(git rev-parse HEAD)" node .github/scripts/generate-release-manifest.js
        env:
          GITHUB_REF_NAME: ${{ steps.branch.outputs.name }}

      - name: Create repository zip
        run: |
          git archive --format=zip --output=.github/release-output/omniplayr-source.zip HEAD

      - name: Load release metadata
        id: release
        run: |
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < .github/release-output/release-env.txt

      - name: Move release tag to current branch head
        run: |
          git tag -f "${{ steps.release.outputs.TAG_NAME }}"
          git push origin "refs/tags/${{ steps.release.outputs.TAG_NAME }}" --force

      - name: Publish release assets
        run: |
          TAG="${{ steps.release.outputs.TAG_NAME }}"
          TITLE="${{ steps.release.outputs.RELEASE_NAME }}"
          NOTES="Important-file manifest for ${{ steps.branch.outputs.name }} at $(git rev-parse HEAD). Combined SHA256: ${{ steps.release.outputs.MANIFEST_SHA256 }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest=false
            if [ "${{ steps.release.outputs.PRERELEASE }}" = "true" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --prerelease=false
            fi
          else
            ARGS=("--title" "$TITLE" "--notes" "$NOTES" "--latest=false")
            if [ "${{ steps.release.outputs.PRERELEASE }}" = "true" ]; then
              ARGS+=("--prerelease")
            fi
            gh release create "$TAG" "${ARGS[@]}"
          fi

          gh release upload "$TAG" \
            .github/release-output/manifest.json#manifest.json \
            .github/release-output/omniplayr-source.zip#omniplayr-source.zip \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
