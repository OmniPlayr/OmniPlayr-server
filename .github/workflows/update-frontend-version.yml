name: Update Frontend Version

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
      - '!frontend/src/config/version.toml'
      - '.github/scripts/update-frontend-version.js'
      - '.github/workflows/update-frontend-version.yml'

concurrency:
  group: version-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OMNIPLAYR_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMNIPLAYR_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update Frontend Version
        run: node .github/scripts/update-frontend-version.js
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Get GitHub App bot user ID
        id: app-user
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push if changed
        run: |
          git config --local user.email "${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --local user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          
          if git diff --quiet frontend/src/config/version.toml; then
            echo "No changes to version file"
          else
            git add frontend/src/config/version.toml
            git commit -m "chore: update frontend version"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
