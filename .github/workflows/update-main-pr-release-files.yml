name: Update Main PR Release Files

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'frontend/**'
      - '!frontend/src/config/version.toml'
      - 'backend/**'
      - '!backend/config.json'
      - 'composers/**'
      - '.github/scripts/update-frontend-version.js'
      - '.github/scripts/update-backend-version.js'
      - '.github/workflows/update-main-pr-release-files.yml'

concurrency:
  group: main-pr-release-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-release-files:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.PR_VERSION_UPDATE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update frontend and backend versions for main
        run: |
          node .github/scripts/update-frontend-version.js
          node .github/scripts/update-backend-version.js
        env:
          VERSION_BRANCH: main
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Commit and push generated release files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add frontend/src/config/version.toml backend/config.json

          if git diff --cached --quiet; then
            echo "No generated release file changes"
          else
            git commit -m "chore: update main release files"
            git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi
