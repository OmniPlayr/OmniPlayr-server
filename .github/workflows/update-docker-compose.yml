name: Update Root Docker Compose

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'composers/**'
      - '.github/workflows/update-docker-compose.yml'

jobs:
  update-compose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OMNIPLAYR_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OMNIPLAYR_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Select composer based on branch
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            cp composers/main/docker-compose.yml docker-compose.yml
          else
            cp composers/dev/docker-compose.yml docker-compose.yml
          fi

      - name: Get GitHub App bot user ID
        id: app-user
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          echo "user-id=$user_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push if changed
        run: |
          git config --local user.email "${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --local user.name "${{ steps.app-token.outputs.app-slug }}[bot]"

          if git diff --quiet docker-compose.yml; then
            echo "No changes to docker-compose.yml"
          else
            git add docker-compose.yml
            git commit -m "chore: update root docker-compose.yml from ${{ github.ref_name }} composer"
            git push
          fi
